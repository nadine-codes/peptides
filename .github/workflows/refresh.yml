name: Scheduled intelligence refresh

# Runs the PeptSight pipeline every 6 hours and commits the resulting
# JSON reports to public/data/. Vercel auto-deploys on the resulting
# commit, so visitors always see freshly-cached data with no live wait.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY
#   APIFY_TOKEN

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab
    inputs:
      categories:
        description: "Optional space-separated categories (default: all 7)"
        required: false
        type: string

permissions:
  contents: write           # needed to commit the regenerated JSON

concurrency:
  group: peptsight-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
        run: npm run refresh -- ${{ github.event.inputs.categories }}

      - name: Commit refreshed reports
        run: |
          git config user.name "peptsight-refresh[bot]"
          git config user.email "peptsight-refresh@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/data/)" ]; then
            git add public/data/
            ts=$(date -u +"%Y-%m-%dT%H:%MZ")
            git commit -m "chore(data): scheduled refresh ${ts}"
            git push
          else
            echo "No changes to commit."
          fi
