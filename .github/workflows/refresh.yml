name: Scheduled intelligence refresh

# Runs the PeptSight pipeline every 6 hours. Each research category runs in
# its own parallel matrix job so a single slow/failing category cannot stall
# the others. A final commit job collects whichever JSON reports succeeded
# and pushes them to public/data/. Vercel auto-deploys on the resulting
# commit, so visitors always see freshly-cached data with no live wait.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY
#   APIFY_TOKEN

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab
    inputs:
      categories:
        description: "Optional space-separated categories (default: all 7)"
        required: false
        type: string

permissions:
  contents: write           # needed to commit the regenerated JSON

concurrency:
  group: peptsight-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          INPUT_CATS: ${{ github.event.inputs.categories }}
        run: |
          if [ -n "$INPUT_CATS" ]; then
            json=$(echo "$INPUT_CATS" | tr ' ' '\n' | sed '/^$/d' | jq -R . | jq -s -c .)
          else
            json='["fat-loss","recovery","longevity","sleep","muscle-retention","cognitive-performance","skin-health"]'
          fi
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh ${{ matrix.category }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
        run: npm run refresh -- ${{ matrix.category }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.category }}
          path: public/data/${{ matrix.category }}.json
          if-no-files-found: ignore
          retention-days: 1

  commit:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: data-*

      - name: Move artifacts into public/data
        run: |
          mkdir -p public/data
          shopt -s nullglob
          for d in artifacts/data-*/; do
            cp "$d"/*.json public/data/ 2>/dev/null || true
          done

      - name: Commit refreshed reports
        run: |
          git config user.name "peptsight-refresh[bot]"
          git config user.email "peptsight-refresh@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/data/)" ]; then
            git add public/data/
            ts=$(date -u +"%Y-%m-%dT%H:%MZ")
            git commit -m "chore(data): scheduled refresh ${ts}"
            git push
          else
            echo "No changes to commit."
          fi
